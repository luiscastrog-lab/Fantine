
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UV1: La Fabrica de Fantine - Zona 1</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    fog="type: exponential; color: #8B8682; density: 0.02">

    <!-- Cielo gris de Montreuil -->
    <a-sky color="#8B8682"></a-sky>

    <!-- Suelo de adoquines -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20" height="20"
      color="#6B635B"
      material="roughness: 0.9">
    </a-plane>

    <!-- MURO FRONTAL (fachada de la fabrica) -->
    <a-box position="0 3 -8" width="16" height="6" depth="0.5"
           color="#7A7068" material="roughness: 0.95"></a-box>

    <!-- Porton de hierro -->
    <a-box position="0 1.5 -7.7" width="3" height="3" depth="0.1"
           color="#2C2C2C" material="metalness: 0.8; roughness: 0.3"></a-box>

    <!-- Letrero: FABRIQUE MADELEINE -->
    <a-entity
      text="value: FABRIQUE MADELEINE; color: #D4A574; align: center; width: 6; font: mozillavr"
      position="0 4.5 -7.6">
    </a-entity>
    <a-entity
      text="value: Montreuil-sur-Mer, 1823; color: #A0896E; align: center; width: 4; font: mozillavr"
      position="0 4.0 -7.6">
    </a-entity>

    <!-- MUROS LATERALES -->
    <a-box position="-8 3 -4" width="0.5" height="6" depth="8"
           color="#7A7068" material="roughness: 0.95"></a-box>
    <a-box position="8 3 -4" width="0.5" height="6" depth="8"
           color="#7A7068" material="roughness: 0.95"></a-box>

    <!-- MESA con carta de Fantine -->
    <a-box position="3 0.4 -3" width="1.2" height="0.05" depth="0.7"
           color="#5C3A1E" material="roughness: 0.8"></a-box>
    <!-- Patas de la mesa -->
    <a-box position="2.5 0.2 -2.7" width="0.05" height="0.4" depth="0.05" color="#5C3A1E"></a-box>
    <a-box position="3.5 0.2 -2.7" width="0.05" height="0.4" depth="0.05" color="#5C3A1E"></a-box>
    <a-box position="2.5 0.2 -3.3" width="0.05" height="0.4" depth="0.05" color="#5C3A1E"></a-box>
    <a-box position="3.5 0.2 -3.3" width="0.05" height="0.4" depth="0.05" color="#5C3A1E"></a-box>

    <!-- Carta sobre la mesa (interactiva) -->
    <a-plane id="carta" position="3 0.46 -3" rotation="-90 15 0"
             width="0.35" height="0.5" color="#F5E6C8"
             class="clickable">
    </a-plane>
    <a-entity
      text="value: Carta de Fantine; color: #5C3A1E; align: center; width: 1.2; font: mozillavr"
      position="3 0.8 -3">
    </a-entity>

    <!-- Panel oculto: aparece al mirar la carta -->
    <a-entity id="panel-carta" visible="false" position="3 2 -3">
      <a-plane color="#1A1A2E" width="3" height="1.5" opacity="0.92"></a-plane>
      <a-entity
        text="value: Queridos Thenardier - Les suplico noticias de mi pequena Cosette. Les envio lo poco que tengo. Diganme que esta bien. Su madre, Fantine.; color: #FFFDF8; align: center; width: 2.6; wrapCount: 45; font: mozillavr"
        position="0 0 0.05">
      </a-entity>
    </a-entity>

    <!-- RELOJ DE PARED (pared derecha) -->
    <a-circle id="reloj" position="7.7 3.5 -4" rotation="0 -90 0"
              radius="0.5" color="#2C2C2C" class="clickable">
    </a-circle>
    <a-entity
      text="value: 5:45 AM; color: #D4A574; align: center; width: 1.5; font: mozillavr"
      position="7.6 3.5 -4" rotation="0 -90 0">
    </a-entity>

    <!-- CARTEL DE EPOCA (pared izquierda) -->
    <a-plane id="cartel" position="-7.7 2.5 -4" rotation="0 90 0"
             width="1.2" height="1.6" color="#C4A882"
             class="clickable">
    </a-plane>
    <a-entity
      text="value: Industria de\ncuentas de\nazabache; color: #3A2A1A; align: center; width: 2; font: mozillavr"
      position="-7.6 2.5 -4" rotation="0 90 0">
    </a-entity>

    <!-- Panel oculto: contexto historico -->
    <a-entity id="panel-contexto" visible="false" position="-5 2.5 -4" rotation="0 45 0">
      <a-plane color="#1A1A2E" width="3.5" height="2" opacity="0.92"></a-plane>
      <a-entity
        text="value: Montreuil-sur-Mer prospero gracias a la industria de cuentas de azabache ingles. El Padre Madeleine transformo la ciudad - cualquiera que tuviera hambre encontraba empleo y pan en su fabrica. (Victor Hugo, Los Miserables, 1862); color: #FFFDF8; align: center; width: 3; wrapCount: 45; font: mozillavr"
        position="0 0 0.05">
      </a-entity>
    </a-entity>

    <!-- TEXTO DE BIENVENIDA -->
    <a-entity
      text="value: Bienvenido a la Fabrica de Fantine; color: #D4A574; align: center; width: 5; font: mozillavr"
      position="0 5.5 -7.6">
    </a-entity>
    <a-entity
      text="value: Mira los objetos para interactuar; color: #A0896E; align: center; width: 4; font: mozillavr"
      position="0 0.3 -5">
    </a-entity>

    <!-- ILUMINACION -->
    <a-light type="ambient" color="#8B7355" intensity="0.3"></a-light>
    <a-light type="point" color="#FFB347" intensity="0.8" distance="8" position="-6 4 -2"></a-light>
    <a-light type="point" color="#FFB347" intensity="0.8" distance="8" position="6 4 -2"></a-light>
    <a-light type="directional" color="#D4A574" intensity="0.4" position="2 5 2"></a-light>

    <!-- FAROLES DE GAS (decorativos) -->
    <a-cylinder position="-6 2 -2" radius="0.05" height="4" color="#3A3A3A"></a-cylinder>
    <a-sphere position="-6 4.1 -2" radius="0.15" color="#FFB347" material="emissive: #FFB347; emissiveIntensity: 0.5"></a-sphere>
    <a-cylinder position="6 2 -2" radius="0.05" height="4" color="#3A3A3A"></a-cylinder>
    <a-sphere position="6 4.1 -2" radius="0.15" color="#FFB347" material="emissive: #FFB347; emissiveIntensity: 0.5"></a-sphere>

    <!-- PARTICULAS: niebla/polvo ligero -->
    <a-entity
      particle-system="preset: dust; particleCount: 150; color: #8B8682; size: 0.08; opacity: 0.25; maxAge: 5">
    </a-entity>

    <!-- CAMARA Y CONTROLES -->
    <a-entity id="rig" position="0 0 2">
      <a-camera look-controls="pointerLockEnabled: false"
                wasd-controls="acceleration: 20">
        <!-- Cursor de mirada: mira un objeto 2 seg y se activa -->
        <a-cursor
          fuse="true"
          fuse-timeout="2000"
          color="#FF5900"
          raycaster="objects: .clickable"
          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 2000; from: 1 1 1; to: 0.1 0.1 0.1"
          animation__reset="property: scale; startEvents: mouseleave; dur: 300; to: 1 1 1">
        </a-cursor>
      </a-camera>
      <!-- Controladores Meta Quest -->
      <a-entity oculus-touch-controls="hand: left"></a-entity>
      <a-entity oculus-touch-controls="hand: right"
                raycaster="objects: .clickable; showLine: true"
                laser-controls="hand: right">
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- LOGICA DE INTERACCIONES -->
  <script>
    // Esperar a que la escena cargue
    document.querySelector('a-scene').addEventListener('loaded', function () {

      // --- CARTA DE FANTINE ---
      var carta = document.querySelector('#carta');
      var panelCarta = document.querySelector('#panel-carta');
      var cartaAbierta = false;

      carta.addEventListener('click', function () {
        cartaAbierta = !cartaAbierta;
        panelCarta.setAttribute('visible', cartaAbierta);
      });

      // --- CARTEL DE EPOCA ---
      var cartel = document.querySelector('#cartel');
      var panelContexto = document.querySelector('#panel-contexto');
      var cartelAbierto = false;

      cartel.addEventListener('click', function () {
        cartelAbierto = !cartelAbierto;
        panelContexto.setAttribute('visible', cartelAbierto);
      });

      // --- RELOJ ---
      var reloj = document.querySelector('#reloj');
      var campanaSonando = false;

      reloj.addEventListener('click', function () {
        if (!campanaSonando) {
          campanaSonando = true;
          // Cambiar color del reloj brevemente para feedback visual
          reloj.setAttribute('color', '#FFB347');
          setTimeout(function () {
            reloj.setAttribute('color', '#2C2C2C');
            campanaSonando = false;
          }, 2000);
        }
      });

    });
  </script>
</body>
</html>
